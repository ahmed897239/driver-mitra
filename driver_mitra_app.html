    // Haversine Distance in KM
    function calculateHaversineDistanceKm(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return parseFloat((R * c).toFixed(1));
    }

            <div className="fixed bottom-20 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 text-xs font-bold animate-bounce">
              {toast}
            </div>
          )}

          {/* 8. FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-center py-6 text-xs border-t border-slate-800">
            <p className="font-bold text-white">DRIVER MITRA — Your Roadside Partner</p>
            <p className="text-[11px] mt-1">24x7 India Highway Roadside Network for Heavy Commercial Vehicles</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DriverMitraApp />);
  </script>
</body>
</html>
